name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run exchange flow tests
        run: node --test tests/*.mjs
